<@cTpl>
<#if !entry.onlyDisplayInBack>
    <@cRow class='mb-3'>
        <@cCol>
            <@cLabel label=entry.title!'' />
        </@cCol>
        <#if list_responses?has_content>
            <#list list_responses as response>
                <@cCol>
                    <#if response.responseValue??>
                        ${response.responseValue?number?number_to_date}
                    </#if>
                </@cCol>
            </#list>
        </#if>
    </@cRow>
</#if>
</@cTpl>

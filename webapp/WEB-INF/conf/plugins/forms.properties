# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
forms.pageTitle=forms
forms.pagePathLabel=forms

# Paginator default value
forms.itemsPerPage=50

# Group element default icon name
forms.composite.group.icon=indent

forms.export.formResponse.form.date.creation.format=dd/MM/yyyy

# Properties for entry type MyLuteceUserAttribute :
entrytype.myluteceuserattribute.attributes.list=user.name.given,user.name.family

# --- Lucene index ---
# forms.internalIndexer.lucene.indexPath
#   Filesystem location of the Lucene index.
#   In a clustered (multi-instance) deployment this MUST point to a volume
#   that is mounted R/W on every instance (NFS, Kubernetes PersistentVolume,
#   etc.), otherwise each node will build a separate and inconsistent index.
#   The default value below resolves to java.io.tmpdir and is only safe for a
#   single-instance setup; FormsPlugin.init() emits a startup warning when
#   this property still points to a JVM-local directory.
# forms.internalIndexer.lucene.indexInWebapp
#   If true, indexPath is resolved relative to the exploded webapp, which is
#   also JVM-local in a cluster. Keep false and use an absolute shared path
#   when deploying on more than one instance.
forms.internalIndexer.lucene.indexPath=java.io.tmpdir/plugins/forms/index
forms.globalIndexer.enable=true
forms.internalIndexer.lucene.indexInWebapp=false
forms.index.writer.commit.size=1000

# --- Async exports (CSV / PDF of multiview extractions) ---
# Export files are produced asynchronously and persisted by plugin-filegenerator.
# In a clustered (multi-instance) deployment, the node that initiates the export
# may differ from the node that serves the subsequent download, so the generated
# file MUST be reachable from every instance. This is not controlled from the
# plugin-forms side: configure plugin-filegenerator with either a shared storage
# volume (NFS, PV) or a database-backed blob store so that the download endpoint
# works regardless of which node receives the request. Otherwise users will hit
# 404s whenever the load balancer routes them to a different node.
forms.export.csv.zip=true
forms.export.pdf.zip=false
# if forms.export.image.base64 is true, the image will be embedded in the pdf file otherwise the image will be linked
forms.export.image.base64=true

# Duration in minutes of the validity of generated url for file download (if 0, the links will be always valid)
forms.file.download.validity=0

# Duration in milliseconds of the validity of the link to test a form that is not active
#forms.inactive.bypass.duration.milliseconds=1800000

# Dashboard check if formResponse or question is published
forms.publicdashboard.formresponse.isPublished=true
forms.publicdashboard.question.isPublished=true

# Export field list
forms.entryTypeGeolocation.export.fields=address

# --- Forms indexer ---
# forms.index.writer.ms.timeout.lock
#   TTL (in ms) of the distributed Lucene indexing lock held in the
#   forms_lucene_lock table. A shorter TTL means that if the node currently
#   indexing crashes, another node can reclaim the lock faster; the trade-off
#   is that a live indexer must renew the lock more often.
#   LuceneFormSearchIndexer renews the lock via a background heartbeat at
#   TTL/3 while fullIndexing()/incrementalIndexing() are running, so indexing
#   runs longer than the TTL remain safe.
forms.index.writer.ms.timeout.lock=900000
forms.index.writer.multi.apps=true
forms.index.writer.auto.initialize=true

daemon.formsIndexerDaemon.onstartup=1
daemon.formsIndexerDaemon.interval=30

daemon.formsBackupPurgeDaemon.onstartup=1
daemon.formsBackupPurgeDaemon.interval=86400

forms.search.lucene.analyser.className=fr.paris.lutece.plugins.lucene.service.analyzer.LuteceFrenchAnalyzer

